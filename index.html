<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java OOP Quiz — Inheritance & Polymorphism</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@400;500;600;700&display=swap');
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2330;--border:#30363d;--accent:#f78166;--accent2:#79c0ff;--accent3:#7ee787;--text:#e6edf3;--muted:#8b949e;--correct:#1a4a2e;--correct-border:#3fb950;--correct-text:#7ee787;--wrong:#4a1818;--wrong-border:#f85149;--wrong-text:#ff7b72;--selected:#1c3a5c;--selected-border:#79c0ff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;}
.hero{background:linear-gradient(135deg,#0d1117 0%,#1a1f2e 50%,#0d1117 100%);border-bottom:1px solid var(--border);padding:48px 32px 36px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-80px;left:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(121,192,255,.06) 0%,transparent 70%);pointer-events:none;}
.hero::after{content:'';position:absolute;bottom:-60px;right:-60px;width:350px;height:350px;background:radial-gradient(circle,rgba(247,129,102,.06) 0%,transparent 70%);pointer-events:none;}
.badge{display:inline-block;background:rgba(121,192,255,.1);border:1px solid rgba(121,192,255,.3);color:var(--accent2);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:16px;}
.hero h1{font-size:clamp(24px,4vw,42px);font-weight:700;letter-spacing:-.5px;margin-bottom:8px;background:linear-gradient(90deg,var(--text) 60%,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero p{color:var(--muted);font-size:15px;max-width:540px;margin:0 auto 24px;}
.stats-bar{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;}
.stat{text-align:center;}.stat-num{font-size:22px;font-weight:700;color:var(--accent2);}.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.quiz-container{max-width:860px;margin:0 auto;padding:32px 24px 80px;}
.section-divider{display:flex;align-items:center;gap:12px;margin:40px 0 20px;}
.section-divider-line{flex:1;height:1px;background:var(--border);}
.section-divider-text{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;white-space:nowrap;}
.question-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;transition:border-color .2s;}
.question-card:hover{border-color:#444c56;}
.q-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;}
.q-num{background:rgba(121,192,255,.1);border:1px solid rgba(121,192,255,.2);color:var(--accent2);font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;white-space:nowrap;margin-top:3px;font-family:'JetBrains Mono',monospace;flex-shrink:0;}
.q-text{font-size:15px;font-weight:500;line-height:1.65;flex:1;}
.marks-badge{display:inline-block;background:rgba(247,129,102,.15);border:1px solid rgba(247,129,102,.35);color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.8px;padding:1px 7px;border-radius:3px;vertical-align:middle;margin-left:6px;}
.code-block{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin:12px 0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;overflow-x:auto;white-space:pre;color:#e6edf3;}
.kw{color:#ff7b72;}.cls{color:#79c0ff;}.fn{color:#d2a8ff;}.str{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.num{color:#f2cc60;}
.options{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.option{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;background:var(--surface2);user-select:none;}
.option:hover{border-color:#444c56;background:#212830;}
.option.selected{background:var(--selected);border-color:var(--selected-border);}
.option.correct{background:var(--correct);border-color:var(--correct-border);}
.option.wrong{background:var(--wrong);border-color:var(--wrong-border);}
.option.revealed-correct{background:var(--correct);border-color:var(--correct-border);}
.opt-letter{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;min-width:22px;height:22px;border-radius:4px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);margin-top:1px;flex-shrink:0;}
.option.selected .opt-letter{border-color:var(--accent2);color:var(--accent2);}
.option.correct .opt-letter{border-color:var(--correct-border);color:var(--correct-text);}
.option.wrong .opt-letter{border-color:var(--wrong-border);color:var(--wrong-text);}
.option.revealed-correct .opt-letter{border-color:var(--correct-border);color:var(--correct-text);}
.opt-text{font-size:14px;line-height:1.55;flex:1;}
.opt-icon{margin-left:auto;font-size:16px;flex-shrink:0;}
.explanation{display:none;margin-top:14px;padding:13px 16px;background:rgba(126,231,135,.04);border-left:3px solid var(--accent3);border-radius:0 6px 6px 0;font-size:13px;line-height:1.7;}
.explanation.show{display:block;}
.exp-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.exp-tag{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:3px;}
.exp-tag-section{background:rgba(247,129,102,.12);color:var(--accent);border:1px solid rgba(247,129,102,.25);}
.exp-tag-trace{background:rgba(210,168,255,.12);color:#d2a8ff;border:1px solid rgba(210,168,255,.25);}
.exp-tag-error{background:rgba(255,123,114,.12);color:#ff7b72;border:1px solid rgba(255,123,114,.25);}
.exp-tag-poly{background:rgba(121,192,255,.12);color:#79c0ff;border:1px solid rgba(121,192,255,.25);}
.exp-tag-concept{background:rgba(126,231,135,.12);color:#7ee787;border:1px solid rgba(126,231,135,.25);}
.exp-tag-marks{background:rgba(247,129,102,.15);color:var(--accent);border:1px solid rgba(247,129,102,.3);}
.exp-body{color:#a5d6ff;}
.submit-zone{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 65%,transparent);padding:24px 0 16px;text-align:center;}
.progress-bar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;}
.progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent3));border-radius:3px;transition:width .3s;width:0%;}
.progress-text{font-size:13px;color:var(--muted);white-space:nowrap;}
.btn-submit{background:linear-gradient(135deg,#1f6feb,#388bfd);color:white;border:none;padding:14px 48px;border-radius:8px;font-family:'Sora',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px;}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(56,139,253,.35);}
.btn-submit:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.result-panel{display:none;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;margin-bottom:32px;}
.result-panel.show{display:block;}
.score-circle{width:140px;height:140px;border-radius:50%;margin:0 auto 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--accent3);background:rgba(126,231,135,.06);}
.score-num{font-size:38px;font-weight:700;color:var(--accent3);line-height:1;}
.score-denom{font-size:14px;color:var(--muted);}
.score-pct{font-size:14px;font-weight:600;color:var(--accent3);margin-top:4px;}
.result-grade{font-size:24px;font-weight:700;margin-bottom:8px;}
.result-msg{color:var(--muted);font-size:15px;margin-bottom:24px;}
.result-breakdown{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;}
.rb-item{text-align:center;padding:12px 20px;border-radius:8px;min-width:80px;}
.rb-score{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.2);}
.rb-wrong{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.2);}
.rb-skip{background:rgba(139,148,158,.1);border:1px solid rgba(139,148,158,.2);}
.rb-num{font-size:24px;font-weight:700;}
.rb-score .rb-num{color:var(--accent3);}.rb-wrong .rb-num{color:#ff7b72;}.rb-skip .rb-num{color:var(--muted);}
.rb-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.btn-retry{margin-top:24px;background:transparent;color:var(--accent2);border:1px solid rgba(121,192,255,.3);padding:10px 28px;border-radius:8px;font-family:'Sora',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-retry:hover{background:rgba(121,192,255,.08);}
</style>
</head>
<body>
<div class="hero">
  <div class="badge">Java OOP Master Quiz</div>
  <h1>Inheritance &amp; Polymorphism</h1>
  <p>Constructor chaining, tracing, errors, dynamic dispatch — 70 questions, 80 marks total.</p>
  <div class="stats-bar">
    <div class="stat"><div class="stat-num">70</div><div class="stat-label">Questions</div></div>
    <div class="stat"><div class="stat-num">80</div><div class="stat-label">Total Marks</div></div>
    <div class="stat"><div class="stat-num">MCQ</div><div class="stat-label">Format</div></div>
  </div>
</div>

<div class="quiz-container">
  <div class="result-panel" id="resultPanel">
    <div class="score-circle">
      <span class="score-num" id="scoreNum">0</span>
      <span class="score-denom">/80</span>
      <span class="score-pct" id="scorePct">0%</span>
    </div>
    <div class="result-grade" id="resultGrade"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="result-breakdown">
      <div class="rb-item rb-score"><div class="rb-num" id="rbScore">0</div><div class="rb-label">Score</div></div>
      <div class="rb-item rb-wrong"><div class="rb-num" id="rbWrong">0</div><div class="rb-label">Wrong</div></div>
      <div class="rb-item rb-skip"><div class="rb-num" id="rbSkip">0</div><div class="rb-label">Skipped</div></div>
    </div>
    <button class="btn-retry" onclick="retryQuiz()">Retry Quiz</button>
  </div>

  <div id="quizBody"></div>

  <div class="submit-zone">
    <div class="progress-bar-wrap">
      <span class="progress-text" id="progressText">0 / 70 answered</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitQuiz()">Submit &amp; See Results</button>
  </div>
</div>

<script>
// Each Q: {s, tag, marks, q, code, opts, ans, exp}
// tag: trace|error|poly|concept  marks: 1|2  ans: 0-based  code: string|null
const kw=s=>`<span class="kw">${s}</span>`;
const cls=s=>`<span class="cls">${s}</span>`;
const fn=s=>`<span class="fn">${s}</span>`;
const str=s=>`<span class="str">${s}</span>`;
const num=s=>`<span class="num">${s}</span>`;
const cm=s=>`<span class="cm">${s}</span>`;

const Q=[
// ── SECTION 1: INHERITANCE & CONSTRUCTORS ─────────────────────────────
{s:"Inheritance & Constructors",tag:"trace",marks:1,
q:"What is the output?",
code:`${kw('class')} ${cls('Base')} {
    ${cls('Base')}() { ${cls('System')}.out.println(${str('"Base()"')}); }
    ${cls('Base')}(${kw('int')} x) { ${cls('System')}.out.println(${str('"Base("')} + x + ${str('")"')}); }
}
${kw('class')} ${cls('Child')} ${kw('extends')} ${cls('Base')} {
    ${cls('Child')}() {
        ${kw('super')}(${num('5')});
        ${cls('System')}.out.println(${str('"Child()"')});
    }
}
${kw('new')} ${cls('Child')}();`,
opts:["Child()","Base() Child()","Base(5) Child()","Compile error"],
ans:2,exp:"super(5) calls Base(int x) → prints 'Base(5)', then Child() body prints 'Child()'. Output: Base(5) / Child()"},

{s:"Inheritance & Constructors",tag:"error",marks:1,
q:"What happens when you compile this code?",
code:`${kw('class')} ${cls('Animal')} {
    ${kw('public')} ${cls('Animal')}(${cls('String')} name) {
        ${cls('System')}.out.println(${str('"Animal: "')} + name);
    }
}
${kw('class')} ${cls('Dog')} ${kw('extends')} ${cls('Animal')} {
    ${kw('public')} ${cls('Dog')}() {
        ${cls('System')}.out.println(${str('"Dog created"')});
    }
}`,
opts:["Prints: Dog created","Prints: Animal: null","Compile error — no matching constructor Animal()","Runtime NullPointerException"],
ans:2,exp:"Animal has no default constructor. Dog() implicitly calls super() which doesn't exist. Compile error."},

{s:"Inheritance & Constructors",tag:"trace",marks:1,
q:"What is the output?",
code:`${kw('class')} ${cls('A')} {
    ${cls('A')}() {
        ${kw('this')}(${num('1')});
        ${cls('System')}.out.println(${str('"A()"')});
    }
    ${cls('A')}(${kw('int')} n) { ${cls('System')}.out.println(${str('"A("')}+n+${str('")"')}); }
}
${kw('class')} ${cls('B')} ${kw('extends')} ${cls('A')} {
    ${cls('B')}() { ${cls('System')}.out.println(${str('"B()"')}); }
}
${kw('new')} ${cls('B')}();`,
opts:["B()","A() B()","A(1) A() B()","A(1) B()"],
ans:2,exp:"B() calls super()→A(). A() calls this(1)→A(1) prints, returns to A() which prints, then B() prints. Output: A(1) A() B()"},

{s:"Inheritance & Constructors",tag:"trace",marks:1,
q:"What is the output?",
code:`${kw('class')} ${cls('X')} {
    ${kw('static int')} count = ${num('0')};
    ${cls('X')}() { count++; }
}
${kw('class')} ${cls('Y')} ${kw('extends')} ${cls('X')} {
    ${cls('Y')}() { count++; }
}
${kw('class')} ${cls('Z')} ${kw('extends')} ${cls('Y')} {
    ${cls('Z')}() { count += ${num('3')}; }
}
${kw('new')} ${cls('Z')}();
${cls('System')}.out.println(${cls('X')}.count);`,
opts:["3","4","5","6","None of the above"],
ans:2,exp:"new Z(): super()→Y(): super()→X(): count=1 → Y(): count=2 → Z(): count+=3=5. Output: 5"},

{s:"Inheritance & Constructors",tag:"error",marks:1,
q:"What is wrong with this code?",
code:`${kw('class')} ${cls('Vehicle')} {
    ${cls('Vehicle')}(${cls('String')} type) {
        ${cls('System')}.out.println(${str('"Vehicle: "')} + type);
    }
}
${kw('class')} ${cls('Car')} ${kw('extends')} ${cls('Vehicle')} {
    ${kw('int')} doors;
    ${cls('Car')}(${kw('int')} doors) {
        ${kw('this')}.doors = doors;
    }
}`,
opts:["Car cannot have fields","super(type) must be called first in Car's constructor","Vehicle must have a no-arg constructor","this.doors is not accessible"],
ans:1,exp:"Car() doesn't call super(someString). Vehicle has no default constructor → compile error. Must call super(type) explicitly."},

{s:"Inheritance & Constructors",tag:"trace",marks:1,
q:"What does this print?",
code:`${kw('class')} ${cls('Animal')} {
    ${cls('String')} name = ${str('"Animal"')};
    ${cls('Animal')}() { ${fn('print')}(); }
    ${kw('void')} ${fn('print')}() { ${cls('System')}.out.println(${str('"Animal: "')} + name); }
}
${kw('class')} ${cls('Dog')} ${kw('extends')} ${cls('Animal')} {
    ${cls('String')} name = ${str('"Dog"')};
    ${kw('void')} ${fn('print')}() { ${cls('System')}.out.println(${str('"Dog: "')} + name); }
}
${kw('new')} ${cls('Dog')}();`,
opts:["Animal: Animal","Dog: Dog","Dog: null","Animal: Dog"],
ans:2,exp:"During Animal's constructor, print() dispatches to Dog.print() (polymorphism). Dog.name not yet initialized → null. Prints 'Dog: null'."},

{s:"Inheritance & Constructors",tag:"error",marks:1,
q:"Identify the compile error:",
code:`${kw('class')} ${cls('Foo')} {
    ${cls('Foo')}() { ${cls('System')}.out.println(${str('"Foo"')}); }
}
${kw('class')} ${cls('Bar')} ${kw('extends')} ${cls('Foo')} {
    ${cls('Bar')}() {
        ${cls('System')}.out.println(${str('"Bar"')});
        ${kw('super')}();
    }
}`,
opts:["Bar cannot call super()","super() must be the first statement in the constructor","Foo() must be declared protected","No error"],
ans:1,exp:"super() MUST be the first statement in a constructor. Any code before it is a compile error."},

{s:"Inheritance & Constructors",tag:"trace",marks:1,
q:"What is the output?",
code:`${kw('class')} ${cls('Base')} {
    ${kw('int')} x = ${num('5')};
    { x = ${num('10')}; }
    ${cls('Base')}() { x = ${num('15')}; }
}
${kw('class')} ${cls('Sub')} ${kw('extends')} ${cls('Base')} {
    ${cls('Sub')}() {
        ${cls('System')}.out.println(x);
    }
}
${kw('new')} ${cls('Sub')}();`,
opts:["5","10","15","0"],
ans:2,exp:"Execution order: field x=5 → instance initializer x=10 → Base() x=15 → Sub() prints x=15."},

{s:"Inheritance & Constructors",tag:"error",marks:1,
q:"What error occurs?",
code:`${kw('class')} ${cls('Parent')} {
    ${cls('Parent')}(${kw('int')} n) {}
}
${kw('class')} ${cls('Child')} ${kw('extends')} ${cls('Parent')} {
    ${cls('Child')}() {
        ${cls('System')}.out.println(${str('"Child"')});
    }
    ${cls('Child')}(${kw('int')} n) {
        ${kw('this')}();
    }
}`,
opts:["Child() must call super(int)","this() creates infinite recursion","No error","Child(int) cannot call this()","None of the above"],
ans:0,exp:"Child() has no super(int) call and Parent has no default constructor. Compile error on Child() — must call super(someInt)."},

{s:"Inheritance & Constructors",tag:"trace",marks:1,
q:"What is the output?",
code:`${kw('class')} ${cls('G')} {
    ${kw('static')} { ${cls('System')}.out.print(${str('"G "')}); }
    { ${cls('System')}.out.print(${str('"g "')}); }
    ${cls('G')}() { ${cls('System')}.out.print(${str('"gc "')}); }
}
${kw('class')} ${cls('H')} ${kw('extends')} ${cls('G')} {
    ${kw('static')} { ${cls('System')}.out.print(${str('"H "')}); }
    { ${cls('System')}.out.print(${str('"h "')}); }
    ${cls('H')}() { ${cls('System')}.out.print(${str('"hc "')}); }
}
${kw('new')} ${cls('H')}();`,
opts:["G H g gc h hc","G g gc H h hc","hc h gc g H G","G H gc hc"],
ans:0,exp:"Order: G static → H static → G instance init → G constructor → H instance init → H constructor. Output: G H g gc h hc"},

{s:"Inheritance & Constructors",tag:"trace",marks:1,
q:"What does this print?",
code:`${kw('class')} ${cls('M')} {
    ${kw('int')} val;
    ${cls('M')}() { val = ${num('10')}; }
    ${cls('M')}(${kw('int')} v) { val = v; }
}
${kw('class')} ${cls('N')} ${kw('extends')} ${cls('M')} {
    ${cls('N')}(${kw('int')} v) { ${kw('super')}(v * ${num('2')}); }
}
${cls('M')} obj = ${kw('new')} ${cls('N')}(${num('3')});
${cls('System')}.out.println(obj.val);`,
opts:["3","6","10","Compile error"],
ans:1,exp:"new N(3) calls super(6) → M(int) sets val=6. Fields are not polymorphic; obj.val=6."},

{s:"Inheritance & Constructors",tag:"error",marks:1,
q:"Which code snippet causes a compile error?",
code:null,
opts:[
  "class A {} class B extends A { B(){super();} }",
  "class A {A(int x){}} class B extends A {B(){super(5);}}",
  "class A {private A(){}} class B extends A {}",
  "class A {A(){}} class B extends A {B(int x){super();}}"
],
ans:2,exp:"A's only constructor is private. B cannot call it. Compile error — super() is inaccessible."},

{s:"Inheritance & Constructors",tag:"trace",marks:1,
q:"How many times is 'Hello' printed?",
code:`${kw('class')} ${cls('P')} {
    ${cls('P')}() { ${cls('System')}.out.println(${str('"Hello"')}); }
}
${kw('class')} ${cls('Q')} ${kw('extends')} ${cls('P')} {
    ${cls('Q')}() { ${kw('super')}(); ${kw('super')}(); }
}`,
opts:["0 — compile error","1","2","Runtime error"],
ans:0,exp:"You cannot call super() more than once. Second super() is a compile error. 'Hello' is never printed."},

{s:"Inheritance & Constructors",tag:"trace",marks:2,
q:`What is the output? <span class="marks-badge">2 marks</span>`,
code:`${kw('class')} ${cls('A')} {
    ${cls('A')}() { ${fn('init')}(); }
    ${kw('void')} ${fn('init')}() { ${cls('System')}.out.println(${str('"A.init"')}); }
}
${kw('class')} ${cls('B')} ${kw('extends')} ${cls('A')} {
    ${kw('int')} x = ${num('100')};
    ${cls('B')}() { ${cls('System')}.out.println(${str('"B() x="')} + x); }
    ${kw('void')} ${fn('init')}() { ${cls('System')}.out.println(${str('"B.init x="')} + x); }
}
${kw('new')} ${cls('B')}();`,
opts:["A.init then B() x=100","B.init x=100 then B() x=100","B.init x=0 then B() x=100","A.init then B.init x=100 then B() x=100","None of the above"],
ans:2,exp:"A() calls init() → dispatches to B.init() (polymorphism during construction). B.x not yet initialized → 0. Then x=100. Then B() prints 'B() x=100'."},

  const letters=['A','B','C','D','E'];
  const tagLabel={trace:'Trace',error:'Error Hunt',poly:'Polymorphism',concept:'Concept'};
  const tagCls={trace:'exp-tag-trace',error:'exp-tag-error',poly:'exp-tag-poly',concept:'exp-tag-concept'};

  Q.forEach((q,i)=>{
    if(q.s!==curSec){
      curSec=q.s;
      html+=`<div class="section-divider"><div class="section-divider-line"></div><span class="section-divider-text">${q.s}</span><div class="section-divider-line"></div></div>`;
    }
    html+=`<div class="question-card" id="qcard-${i}">
      <div class="q-header">
        <span class="q-num">Q${i+1}</span>
        <span class="q-text">${q.q}</span>
      </div>`;
    if(q.code) html+=`<div class="code-block">${q.code}</div>`;
    html+=`<div class="options">`;
    q.opts.forEach((opt,j)=>{
      html+=`<div class="option" id="opt-${i}-${j}" onclick="pick(${i},${j})">
        <span class="opt-letter">${letters[j]}</span>
        <span class="opt-text">${opt}</span>
        <span class="opt-icon" id="icon-${i}-${j}"></span>
      </div>`;
    });
    html+=`</div>
      <div class="explanation" id="exp-${i}">
        <div class="exp-meta">
          <span class="exp-tag exp-tag-section">${q.s}</span>
          <span class="exp-tag ${tagCls[q.tag]}">${tagLabel[q.tag]}</span>
          ${q.marks===2?`<span class="exp-tag exp-tag-marks">2 marks</span>`:''}
        </div>
        <span class="exp-body">${q.exp}</span>
      </div>
    </div>`;
  });
  body.innerHTML=html;
}

function pick(qi,oi){
  if(submitted)return;
  const prev=answered[qi];
  if(prev!==undefined) document.getElementById(`opt-${qi}-${prev}`).classList.remove('selected');
  answered[qi]=oi;
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
  updateProgress();
}

function updateProgress(){
  const n=Object.keys(answered).length;
  document.getElementById('progressText').textContent=`${n} / ${Q.length} answered`;
  document.getElementById('progressFill').style.width=(n/Q.length*100)+'%';
}

function submitQuiz(){
  submitted=true;
  document.getElementById('submitBtn').disabled=true;
  let score=0,wrong=0,skip=0;
  Q.forEach((q,i)=>{
    const ua=answered[i], ca=q.ans;
    if(ua===undefined){
      skip++;
      document.getElementById(`opt-${i}-${ca}`).classList.add('revealed-correct');
    } else if(ua===ca){
      score+=q.marks;
      document.getElementById(`opt-${i}-${ua}`).classList.add('correct');
      document.getElementById(`icon-${i}-${ua}`).textContent='✓';
    } else {
      wrong++;
      document.getElementById(`opt-${i}-${ua}`).classList.add('wrong');
      document.getElementById(`icon-${i}-${ua}`).textContent='✗';
      document.getElementById(`opt-${i}-${ca}`).classList.add('revealed-correct');
      document.getElementById(`icon-${i}-${ca}`).textContent='✓';
    }
    document.getElementById(`exp-${i}`).classList.add('show');
  });
  const pct=Math.round(score/TOTAL_MARKS*100);
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scorePct').textContent=pct+'%';
  document.getElementById('rbScore').textContent=score;
  document.getElementById('rbWrong').textContent=wrong;
  document.getElementById('rbSkip').textContent=skip;
  let g,m;
  if(pct>=90){g='🏆 Excellent!';m='You have mastered Java OOP inheritance and polymorphism.';}
  else if(pct>=75){g='👏 Great Job!';m='Solid understanding — review missed questions to reach mastery.';}
  else if(pct>=60){g='📚 Good Effort';m='Good foundation. Focus on dynamic dispatch and constructor chaining.';}
  else if(pct>=40){g='💪 Keep Going';m='Review the explanations carefully — focus on tracing and error types.';}
  else{g='🔄 Keep Practicing';m='Study the fundamentals of inheritance and re-attempt the quiz.';}
  document.getElementById('resultGrade').textContent=g;
  document.getElementById('resultMsg').textContent=m;
  document.getElementById('resultPanel').classList.add('show');
  document.getElementById('resultPanel').scrollIntoView({behavior:'smooth'});
}

function retryQuiz(){
  answered={};submitted=false;
  document.getElementById('submitBtn').disabled=false;
  document.getElementById('resultPanel').classList.remove('show');
  renderQuiz();updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

renderQuiz();updateProgress();
</script>
</body>
</html>
